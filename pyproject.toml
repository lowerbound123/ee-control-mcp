[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ee-control-mcp"
version = "0.1.0"
description = "HTTP MCP server for ROS 2 dual-arm RobotCmd control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=9.4",
  "PyYAML>=6",
  "starlette>=0.27",
  "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.9"]

[project.scripts]
ee-control-mcp = "ee_control_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
